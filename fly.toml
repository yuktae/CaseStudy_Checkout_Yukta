# fly.io configuration. Deploy steps are in README.md ("Deploy to fly.io").
app = "exhibit-disputes"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  MODEL = "claude-opus-5"
  SEED_ON_START = "true"
  MAX_FILES = "4"
  MAX_FILE_MB = "20"
  # ANTHROPIC_API_KEY and DEMO_ACCESS_CODE are set with `fly secrets set`, never here.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[mounts]]
  source = "exhibit_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
